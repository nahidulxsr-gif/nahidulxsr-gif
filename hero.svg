<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="0.55" stop-color="#17100D"/>
      <stop offset="1" stop-color="#3A1A05"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD29A"/>
      <stop offset="0.45" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="txtclip">
      <text x="450" y="168" text-anchor="middle" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="10">NAHID</text>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF7900" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect width="900" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="450" cy="170" rx="330" ry="90" fill="#FF6A00" opacity="0.12" filter="url(#blur)">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating particles -->
  <g fill="#FF8A1F">
    <circle cx="80" cy="60" r="2"><animate attributeName="cy" values="60;30;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="110" r="1.6"><animate attributeName="cy" values="110;80;110" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="2.2"><animate attributeName="cy" values="50;85;50" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="130" r="1.8"><animate attributeName="cy" values="130;95;130" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="200" r="1.5"><animate attributeName="cy" values="200;170;200" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Top tag -->
  <text x="450" y="48" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="6" fill="#FF9A3D" opacity="0.9">&lt; INDEPENDENT BUILDER /&gt;</text>

  <!-- 3D extruded NAHID (floating) -->
  <g font-family="Impact,'Arial Black',Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="10" text-anchor="middle">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4s" repeatCount="indefinite"/>
    <!-- soft ground shadow of text -->
    <text x="470" y="190" fill="#000" opacity="0.45" filter="url(#blur)">NAHID</text>
    <!-- extrusion layers -->
    <text x="458" y="176" fill="#4A1E00">NAHID</text>
    <text x="456" y="174" fill="#6B2B00">NAHID</text>
    <text x="454" y="172" fill="#8C3A00">NAHID</text>
    <text x="452" y="170" fill="#B04A00">NAHID</text>
    <text x="451" y="169" fill="#D45B00">NAHID</text>
    <!-- front face -->
    <text x="450" y="168" fill="url(#face)" stroke="#FFE2BF" stroke-width="1.2" filter="url(#glow)">NAHID</text>
    <!-- moving shine across the face -->
    <g clip-path="url(#txtclip)">
      <rect x="-200" y="60" width="120" height="130" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-200;1000" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Full name -->
  <text x="450" y="212" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="14" fill="#FFFFFF">NAHIDUL ISLAM</text>
  <rect x="300" y="224" width="300" height="2" fill="#FF7900" opacity="0.8">
    <animate attributeName="width" values="40;300;40" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="430;300;430" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="250" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" letter-spacing="5" fill="#C9B8A8">DESIGNING IDEAS · BUILDING DIGITAL EXPERIENCES</text>

  <!-- Ground -->
  <rect x="0" y="318" width="900" height="42" fill="#0A0A0D"/>
  <line x1="0" y1="318" x2="900" y2="318" stroke="#FF7900" stroke-width="2" opacity="0.9"/>
  <!-- moving ground marks -->
  <g stroke="#FF7900" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0; -60 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M0 338h30M60 338h30M120 338h30M180 338h30M240 338h30M300 338h30M360 338h30M420 338h30M480 338h30M540 338h30M600 338h30M660 338h30M720 338h30M780 338h30M840 338h30M900 338h30M960 338h30"/>
  </g>

  <!-- Walking person -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-90 0; 1000 0" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(0 318)">
      <ellipse cx="0" cy="2" rx="22" ry="4" fill="#000" opacity="0.5"/>
      <!-- body bob -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0; 0 -3; 0 0" dur="1s" repeatCount="indefinite"/>

        <!-- back arm -->
        <g stroke="#B04A00" stroke-width="7" stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="30 0 -62;-30 0 -62;30 0 -62" dur="1s" repeatCount="indefinite"/>
            <path d="M0 -62 L0 -36"/>
          </g>
        </g>
        <!-- back leg -->
        <g stroke="#B04A00" stroke-width="9" stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-28 0 -34;28 0 -34;-28 0 -34" dur="1s" begin="-0.5s" repeatCount="indefinite"/>
            <path d="M0 -34 L0 -2"/>
            <path d="M0 -2 L9 -2" stroke-width="6"/>
          </g>
        </g>

        <!-- torso + backpack -->
        <rect x="-14" y="-70" width="10" height="26" rx="4" fill="#7A3300"/>
        <path d="M-6 -68 L6 -68 L5 -34 L-5 -34 Z" fill="url(#limb)" stroke="#FFD29A" stroke-width="1"/>
        <!-- head -->
        <circle cx="1" cy="-82" r="12" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="2"/>
        <path d="M-11 -84 Q1 -100 13 -84 Q4 -90 -11 -84 Z" fill="#1A1A1F"/>
        <circle cx="6" cy="-82" r="1.6" fill="#17100D"/>

        <!-- front leg -->
        <g stroke="url(#limb)" stroke-width="9" stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-28 0 -34;28 0 -34;-28 0 -34" dur="1s" repeatCount="indefinite"/>
            <path d="M0 -34 L0 -2"/>
            <path d="M0 -2 L9 -2" stroke-width="6"/>
          </g>
        </g>
        <!-- front arm -->
        <g stroke="url(#limb)" stroke-width="7" stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-30 0 -62;30 0 -62;-30 0 -62" dur="1s" repeatCount="indefinite"/>
            <path d="M0 -62 L0 -36"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="898" height="358" rx="18" fill="none" stroke="#FF7900" stroke-opacity="0.35" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
