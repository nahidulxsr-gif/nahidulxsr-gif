<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Learn, Experiment, Build, Improve" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B12"/><stop offset="1" stop-color="#170E1F"/></linearGradient>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6A00"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<filter id="b"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<g filter="url(#b)"><circle cx="150" cy="260" r="110" fill="#FF6A00" opacity=".3"/><circle cx="1050" cy="40" r="120" fill="#8B5CF6" opacity=".35"/></g>
<line x1="150" y1="150" x2="1050" y2="150" stroke="#22D3EE" stroke-opacity=".5" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/></line>
<g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
<g><rect x="40" y="70" width="240" height="160" rx="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="160" y="118" font-size="34" font-weight="700" fill="url(#a)">01</text><text x="160" y="160" font-size="20" font-weight="700" letter-spacing="5" fill="#F5F5F7">LEARN</text><text x="160" y="190" font-size="13" fill="#B9B3C4">Curious by default</text></g>
<g><rect x="340" y="70" width="240" height="160" rx="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="460" y="118" font-size="34" font-weight="700" fill="url(#a)">02</text><text x="460" y="160" font-size="20" font-weight="700" letter-spacing="5" fill="#F5F5F7">EXPERIMENT</text><text x="460" y="190" font-size="13" fill="#B9B3C4">Try ideas, break things</text></g>
<g><rect x="640" y="70" width="240" height="160" rx="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="760" y="118" font-size="34" font-weight="700" fill="url(#a)">03</text><text x="760" y="160" font-size="20" font-weight="700" letter-spacing="5" fill="#F5F5F7">BUILD</text><text x="760" y="190" font-size="13" fill="#B9B3C4">Turn ideas into things</text></g>
<g><rect x="940" y="70" width="240" height="160" rx="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="1060" y="118" font-size="34" font-weight="700" fill="url(#a)">04</text><text x="1060" y="160" font-size="20" font-weight="700" letter-spacing="5" fill="#F5F5F7">IMPROVE</text><text x="1060" y="190" font-size="13" fill="#B9B3C4">Refine, repeat, grow</text></g>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
